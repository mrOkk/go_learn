services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-postgres
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: shortener_user
      POSTGRES_PASSWORD: shortener_password
    ports:
      - "5432:5432"
    volumes:
      - psql_data_url:/var/lib/postgresql/data
      - ./postgres/initdb/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"

volumes:
  psql_data_url: