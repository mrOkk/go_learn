<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="url"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
        }
        .error {
            margin-top: 20px;
            padding: 15px;
            background: #f8d7da;
            color: #842029;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Сокращатель ссылок</h1>

    <form action="/shorten" method="POST">
        <div class="form-group">
            <input type="url" name="url" placeholder="Вставьте длинную ссылку..." required>
        </div>
        <button type="submit">Сократить</button>
    </form>

    {{if .ShortURL}}
    <div class="result">
        Ваша ссылка: <a href="{{.ShortURL}}" target="_blank">{{.ShortURL}}</a>
    </div>
    {{end}}

    {{if .Error}}
    <div class="error">
        {{.Error}}
    </div>
    {{end}}
</body>
</html>
